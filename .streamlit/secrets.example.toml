[bitrix]
webhook_url = "https://YOUR_DOMAIN.bitrix24.eu/rest/WEBHOOK_ID"

[google]
# Можна вставити повний URL таблиці (код сам витягне spreadsheet_id)
url = "https://docs.google.com/spreadsheets/d/YOUR_SPREADSHEET_ID/edit#gid=0"

# Рекомендований варіант без service account у Python:
# Apps Script Web App проксі
web_app_url = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"
web_app_token = "replace-with-strong-random-token"

# Fallback варіант (якщо не використовуєте web_app_url):
# service_account_info = { ... }

[auth]
username = "admin"
password = "strong-password"
